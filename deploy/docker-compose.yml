# Example: Captionizerr next to Sonarr/Radarr. Mount the media library at the SAME path
# your *arr apps use, so the paths in their webhooks resolve here too
# (otherwise set CAPTIONIZERR_PATH_MAP). Captionizerr only ever creates
# `<video>.captionizerr.<lang>.srt|ass` files next to your videos.
services:
  captionizerr:
    image: ghcr.io/captionizerr/captionizerr:latest
    container_name: captionizerr
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Etc/UTC
      # secrets as files (not visible in `docker inspect`); any CAPTIONIZERR_* secret supports *_FILE
      - ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
      - CAPTIONIZERR_WEBHOOK_KEY_FILE=/run/secrets/webhook_key
    secrets: [anthropic_api_key, webhook_key]
      - PUID=1000                 # informational: the image runs as uid 1000; make the library writable for it
    ports:
      - "8095:8095"
    volumes:
      - ./config:/config          # database, settings, series notes, cache, editor history
      - /path/to/media:/data/media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Files readable by uid 1000 only:  mkdir -m 700 secrets && umask 077 && printf %s 'sk-ant-…' > secrets/anthropic_api_key
secrets:
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  webhook_key:
    file: ./secrets/webhook_key

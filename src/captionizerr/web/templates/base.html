<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% block title %}Captionizerr{% endblock %}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#14171c">
<style>
:root{
  --bg:#f3f4f6; --surface:#ffffff; --fg:#14171c; --muted:#5d6572; --line:#dfe2e8; --ink:#14171c;
  --accent:#9a6400; --accent-fill:#f5c94a; --accent-soft:#fdf3d6;
  --ok:#1f7a4d; --ok-soft:#e2f3ea; --bad:#b4232a; --bad-soft:#fbe7e8; --warn:#8a5a00; --warn-soft:#fbf0d8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1014; --surface:#171a20; --fg:#e8ebf0; --muted:#9ba3b1; --line:#2a2f38; --ink:#0a0b0e;
  --accent:#f2c14e; --accent-fill:#f5c94a; --accent-soft:#2b2412;
  --ok:#5fd39a; --ok-soft:#11261b; --bad:#ff8a8f; --bad-soft:#2d1416; --warn:#f2b45a; --warn-soft:#2a1f0e; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--ink);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:650;font-size:16px;letter-spacing:.01em}
.brand svg{width:28px;height:28px;color:#fff}
nav.main{display:flex;gap:2px;flex-wrap:wrap}
nav.main a{color:#c9ced8;text-decoration:none;padding:8px 12px;border-radius:7px;font-weight:500}
nav.main a:hover{color:#fff;background:#ffffff14}
nav.main a.on{color:#14171c;background:var(--accent-fill)}
.ver{margin-left:auto;color:#8c94a3;font:12px var(--mono)}
main{padding-block:24px 64px}
h1{font-size:22px;margin:0 0 4px} h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.flash{border-radius:8px;padding:10px 14px;margin-bottom:16px;border:1px solid}
.flash.ok{background:var(--ok-soft);color:var(--ok);border-color:currentColor}
.flash.warn{background:var(--warn-soft);color:var(--warn);border-color:currentColor}
.tw{overflow-x:auto} table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:12.5px} .mono{font-family:var(--mono);font-size:12.5px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.failed,.pill.needs_review{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.batched,.pill.waiting_source{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.paused_budget,.pill.running{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.yes{color:var(--ok);font-weight:700} .no{color:var(--muted)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar span{display:block;height:100%;background:var(--accent-fill)}
.big{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}
button,.btn{font:600 13.5px var(--sans);padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block}
button.primary,.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:#14171c}
button.small{padding:4px 10px;font-size:12.5px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
form.inline{display:inline}
label.f{display:grid;gap:4px;font-weight:600;font-size:13px}
label.f span.h,.f span.h,.secret .h{font-weight:400;color:var(--muted);font-size:12.5px}
input[type=text],input[type=number],input[type=url],input[type=password],input[type=search],select,textarea{font:14px var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
textarea{font-family:var(--mono);font-size:12.5px;min-height:220px;resize:vertical}
.fields{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);text-decoration:none;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* --- settings, setup, tests --- */
.h,.mono,.sub{overflow-wrap:anywhere}
.subnav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:4px 0 18px}
.subnav a{padding:8px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;font-weight:600}
.subnav a.on{color:var(--fg);border-color:var(--accent-fill)}
.subnav a:hover{color:var(--fg)}
section.card h2 .pill{font-weight:600;vertical-align:middle}
.svc{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.svc h3{font-size:14px;margin:0 0 8px}
.f.check{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.f.check input{margin-top:3px}
.f.check span.h{display:block}
.row-inline{display:flex;gap:8px;align-items:center}
.row-inline input,.row-inline select{flex:1;min-width:0}
.lockline{padding:6px 0}
.secret label{font-weight:600;font-size:13px}
.secret{display:grid;gap:4px}
.savebar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line);margin-top:4px;z-index:3}
.testbox{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.test-result{font-size:12.5px}
.test-result.ok{color:var(--ok)} .test-result.bad{color:var(--bad)}
button.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;padding:2px 4px}
.btn.small{padding:4px 10px;font-size:12.5px}
.choice{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.choice .opt{display:grid;gap:4px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.choice .opt:has(input:checked){border-color:var(--accent-fill);background:var(--accent-soft)}
.choice .opt input{justify-self:start}
details.adv{margin-top:12px}
details.adv summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.stats{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.stat{display:grid;gap:2px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.setup{max-width:760px;margin:0 auto}
.stepper{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 16px;flex-wrap:wrap;counter-reset:s}
.stepper li{counter-increment:s}
.stepper a{display:block;padding:6px 10px;border-radius:99px;text-decoration:none;font-size:12.5px;color:var(--muted);border:1px solid var(--line)}
.stepper a::before{content:counter(s) ". "}
.stepper li.on a{color:#14171c;background:var(--accent-fill);border-color:var(--accent-fill);font-weight:700}
.stepper li.done a{color:var(--ok);border-color:currentColor}
.hero h1{font-size:24px}
.checklist{list-style:none;padding:0;display:grid;gap:8px}
.checklist li::before{display:inline-block;width:1.4em;font-weight:700}
.checklist li.ok::before{content:"✓";color:var(--ok)} .checklist li.warn::before{content:"•";color:var(--warn)} .checklist li.bad::before{content:"✗";color:var(--bad)}
.btn.primary-outline{border-color:var(--accent-fill)}
.attn{border-left:3px solid var(--bad)}
.kpis{display:flex;gap:16px;flex-wrap:wrap}
.kpi{display:grid}
.kpi b{font-size:22px;font-variant-numeric:tabular-nums}
.kpi a{text-decoration:none}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.progress span{display:block;height:100%;background:var(--ok)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input[type=search]{flex:1 1 200px;min-width:0;font:14px var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/">{% include "_mark.html" %}Captionizerr</a>
  <nav class="main" aria-label="Main">
    <a href="/" class="{{ 'on' if nav=='dashboard' or nav=='job' }}">Dashboard</a>
    <a href="/library" class="{{ 'on' if nav in ('library','series','edit','share') }}">Library</a>
    <a href="/settings" class="{{ 'on' if nav.startswith('settings') or nav == 'setup' }}">Settings</a>
  </nav>
  <span class="ver">v{{ version }}</span>
</div></header>
<main class="wrap">
{% if setup_needed and nav != 'setup' %}<div class="flash warn" role="status"><b>Setup isn't finished.</b> <a href="/setup">Continue the setup</a> to choose an AI provider and languages.</div>{% endif %}
{% if msg %}<div class="flash {{ lvl }}" role="status">{{ msg }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
<script>
// Test / Set up webhook / Find models buttons (settings pages and the setup wizard)
async function postForm(url, form){ const r = await fetch(url, {method:'POST', body: new FormData(form)});
  const j = await r.json().catch(() => ({ok:false, message:'HTTP ' + r.status})); return j; }
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-test],[data-connect]'); if (!b) return;
  const out = b.parentElement.querySelector('.test-result'); const form = b.closest('form');
  b.disabled = true; out.className = 'test-result'; out.textContent = b.dataset.test ? 'Testing…' : 'Setting up…';
  try { const j = await postForm(b.dataset.test ? '/settings/test/' + b.dataset.test : '/settings/connect/' + b.dataset.connect, form);
        out.textContent = (j.ok ? '✓ ' : '✗ ') + j.message; out.classList.add(j.ok ? 'ok' : 'bad');
        if (j.price) fillPrice(j.price); }
  catch (err) { out.textContent = '✗ ' + err.message; out.classList.add('bad'); }
  b.disabled = false;
});
document.getElementById('oll-find')?.addEventListener('click', async () => {
  const hint = document.getElementById('oll-hint'), sel = document.getElementById('oll-model');
  hint.textContent = 'Asking Ollama…';
  try { const r = await fetch('/settings/ollama/models', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({url: document.getElementById('oll-url').value})});
        const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);
        if (!j.models.length) { hint.textContent = 'Ollama has no models yet: ollama pull gemma3:27b'; return; }
        const cur = sel.value; sel.replaceChildren();
        for (const m of j.models) { const o = document.createElement('option'); o.value = m.name;
          o.textContent = `${m.name} · ${m.params || '?'} · ${m.size_gb} GB`; o.selected = m.name === cur; sel.append(o); }
        hint.textContent = `${j.models.length} model(s) found.`; }
  catch (err) { hint.textContent = "Couldn't reach Ollama: " + err.message; }
});

// Model lists and automatic prices (AI provider settings and the setup wizard)
const $ = id => document.getElementById(id);
function fillPrice(p) {
  if (!$('oa-in')) return;
  $('oa-in').value = +p.inp.toFixed(4); $('oa-out').value = +p.out.toFixed(4); $('oa-src').value = p.source;
  const when = p.updated ? ', updated ' + new Date(p.updated * 1000).toLocaleDateString() : '';
  if ($('oa-info')) $('oa-info').textContent = `≈ $${p.per_episode.toFixed(3)} per episode · $${(+p.inp.toFixed(4))} in / $${(+p.out.toFixed(4))} out per 1M tokens · from ${p.source}${when}. You can change them.`;
}
async function lookupPrice(provider, model, base) {
  const fd = new FormData(); fd.append('provider', provider); fd.append('model', model); fd.append('base_url', base || '');
  const r = await fetch('/settings/price', {method: 'POST', body: fd}); return r.ok ? r.json() : {found: false};
}
$('oa-model')?.addEventListener('change', async () => {
  const m = $('oa-model').value.trim(); if (!m) return;
  $('oa-info').textContent = 'Looking up the price…';
  const p = await lookupPrice('openai', m, $('oa-url')?.value);
  if (p.found) fillPrice(p);
  else { $('oa-src').value = 'entered by hand';
         $('oa-info').textContent = `No published price found for “${m}”. Enter it, or the monthly cap can't count this model's cost.`; }
});
$('oa-find')?.addEventListener('click', async () => {
  const form = $('oa-find').closest('form'), hint = $('oa-models-hint') || $('oa-info');
  hint.textContent = 'Asking the provider…';
  const r = await fetch('/settings/models/openai', {method: 'POST', body: new FormData(form)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { hint.textContent = "Couldn't list models: " + (j.error || r.status); return; }
  const dl = $('oa-models'); dl.replaceChildren(...j.models.map(id => Object.assign(document.createElement('option'), {value: id})));
  hint.textContent = `${j.models.length} models available. Click the Model field to pick one.`;
  $('oa-model').focus();
});
async function anthropicInfo() {
  const sel = $('an-model'), info = $('an-info'); if (!sel || !info) return;
  const p = await lookupPrice('anthropic', sel.value, '');
  let text = p.found ? `≈ $${p.per_episode.toFixed(2)} per episode ($${p.inp} in / $${p.out} out per 1M tokens).` : '';
  try { const r = await fetch('/settings/price/check', {method: 'POST'}); const c = (await r.json())[sel.value];
        if (c && c.status === 'matches') text += ' Matches the published price list.';
        if (c && c.status === 'differs') text += ` Note: the published list now says $${c.litellm[0]} in / $${c.litellm[1]} out; the built-in prices may be out of date.`;
  } catch {}
  info.textContent = text;
}
$('an-model')?.addEventListener('change', anthropicInfo); anthropicInfo();
</script>
</body>
</html>
